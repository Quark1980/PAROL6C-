[include mainsail.cfg]

# ----------------------------------------------------------------------
# MCU & BASE CONFIGURATION
# ----------------------------------------------------------------------
[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
baud: 250000

[printer]
kinematics: none
max_velocity: 80
max_accel: 50

[force_move]
enable_force_move: true

[idle_timeout]
timeout: 3000
gcode:

# ----------------------------------------------------------------------
# STEPPER MOTOR DEFINITIONS (PAROL6 6-DOF)
# ----------------------------------------------------------------------

# J1: Base Yaw (GT2 Belt 160:16 = 10:1)
[manual_stepper j1]
step_pin: PF0
dir_pin: !PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 360
gear_ratio: 10:1
velocity: 100
accel: 100
endstop_pin: ^PE5  # RAMPS X-min pin

# J2: Shoulder Pitch (50:1 Gearbox)
[manual_stepper j2]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 360
gear_ratio: 50:1
velocity: 50
accel: 100
endstop_pin: ^PE4  # RAMPS X-max pin

# J3: Elbow Pitch (50:1 Gearbox + 26:26 XT Belt)
[manual_stepper j3]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 360
gear_ratio: 50:1
velocity: 50
accel: 100
endstop_pin: ^PJ1  # RAMPS Y-min pin

# J4: Forearm Roll (Corrected 3D-printed pulley pitch diameter ratio)
[manual_stepper j4]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 360
gear_ratio: 805:180
velocity: 50
accel: 100
endstop_pin: ^PJ0  # RAMPS Y-max pin

# J5: Wrist Pitch (GT2 Belt 60:16 = 3.75:1)
[manual_stepper j5]
step_pin: PC1
dir_pin: PC3
enable_pin: !PC7
microsteps: 16
rotation_distance: 360
gear_ratio: 480:109
velocity: 50
accel: 100
endstop_pin: ^PD3  # RAMPS Z-min pin

# J6: Wrist Roll (Direct Drive 1:1 via AUX breakout board)
[manual_stepper j6]
step_pin: PG1
dir_pin: PG0
enable_pin: !PK1
microsteps: 16
rotation_distance: 360
gear_ratio: 1:1
velocity: 50
accel: 100
endstop_pin: ^PD2  # RAMPS Z-max pin

# ----------------------------------------------------------------------
# END EFFECTOR: SERVO GRIPPER (RAMPS Servo 0 / Pin D11 / PB5)
# ----------------------------------------------------------------------
[servo gripper_servo]
pin: PG5
maximum_servo_angle: 180
minimum_pulse_width: 0.0005
maximum_pulse_width: 0.0025
initial_angle: 90

# ----------------------------------------------------------------------
# GRIPPER CONTROL MACROS
# ----------------------------------------------------------------------
[gcode_macro E]
description: Control gripper via Angle (P/ANGLE=0-180) or Distance (D/MM=0-62.5mm)
gcode:
    {% set max_mm = 62.5 %}
    {% set max_angle = 180.0 %}

    {% if params.D is defined or params.MM is defined %}
        {% set mm = params.D|default(params.MM)|float %}
        {% set mm = [0.0, [mm, max_mm]|min]|max %}  # Clamp between 0 and 62.5mm
        {% set target = max_angle - (mm / max_mm * max_angle) %}
    {% elif params.P is defined or params.ANGLE is defined %}
        {% set target = params.P|default(params.ANGLE)|float %}
        {% set target = [0.0, [target, max_angle]|min]|max %}  # Clamp between 0 and 180°
    {% elif params.S is defined %}
        {% set target = params.S|float %}
        {% set target = [0.0, [target, max_angle]|min]|max %}
    {% else %}
        {% set target = 0.0 %}
    {% endif %}

    SET_SERVO SERVO=gripper_servo ANGLE={target}
    {% set current_mm = (max_angle - target) / max_angle * max_mm %}
    {action_respond_info("Gripper -> Angle: %.1f° | Gap: %.2f mm" % (target, current_mm))}

[gcode_macro OPEN_GRIPPERS]
description: Fully open gripper to 62.5mm
gcode:
    SET_GCODE_VARIABLE MACRO=GRIPPER_PLUS_1 VARIABLE=gap_mm VALUE=62.5
    SET_GCODE_VARIABLE MACRO=GRIPPER_MINUS_1 VARIABLE=gap_mm VALUE=62.5
    E D=62.5

[gcode_macro CLOSE_GRIPPERS]
description: Fully close gripper to 0mm
gcode:
    SET_GCODE_VARIABLE MACRO=GRIPPER_PLUS_1 VARIABLE=gap_mm VALUE=0.0
    SET_GCODE_VARIABLE MACRO=GRIPPER_MINUS_1 VARIABLE=gap_mm VALUE=0.0
    E D=0

[gcode_macro GRIPPER_MOVE]
description: Set gripper gap in millimeters (e.g., GRIPPER_MOVE MM=30)
gcode:
    {% set mm = params.MM|default(params.D|default(0))|float %}
    E D={mm}

[gcode_macro PARK_SERVO]
description: Open gripper and disable servo PWM to prevent jitter/overheating
gcode:
    E D=62.5
    SET_SERVO SERVO=gripper_servo WIDTH=0

[gcode_macro GRIPPER_PLUS_1]
description: Open gripper by 1mm
variable_gap_mm: 62.5
gcode:
    {% set target = gap_mm + 1.0 %}
    {% set target = [0.0, [target, 62.5]|min]|max %}
    SET_GCODE_VARIABLE MACRO=GRIPPER_PLUS_1 VARIABLE=gap_mm VALUE={target}
    SET_GCODE_VARIABLE MACRO=GRIPPER_MINUS_1 VARIABLE=gap_mm VALUE={target}
    E D={target}

[gcode_macro GRIPPER_MINUS_1]
description: Close gripper by 1mm
variable_gap_mm: 62.5
gcode:
    {% set target = gap_mm - 1.0 %}
    {% set target = [0.0, [target, 62.5]|min]|max %}
    SET_GCODE_VARIABLE MACRO=GRIPPER_PLUS_1 VARIABLE=gap_mm VALUE={target}
    SET_GCODE_VARIABLE MACRO=GRIPPER_MINUS_1 VARIABLE=gap_mm VALUE={target}
    E D={target}

# ----------------------------------------------------------------------
# POWER & HOMING SEQUENCES
# ----------------------------------------------------------------------
[gcode_macro WAKE_ARM]
description: Energize all arm manual stepper drivers
gcode:
    MANUAL_STEPPER STEPPER=j1 ENABLE=1
    MANUAL_STEPPER STEPPER=j2 ENABLE=1
    MANUAL_STEPPER STEPPER=j3 ENABLE=1
    MANUAL_STEPPER STEPPER=j4 ENABLE=1
    MANUAL_STEPPER STEPPER=j5 ENABLE=1
    MANUAL_STEPPER STEPPER=j6 ENABLE=1
    {action_respond_info("All arm manual steppers re-energized.")}

[gcode_macro HOME_J1]
gcode:
    {% set home_offset = 0.0 %}
    {% set safe_position = 174.0 %}
    WAKE_ARM
    MANUAL_STEPPER STEPPER=j1 SET_POSITION=0
    MANUAL_STEPPER STEPPER=j1 MOVE=-360 STOP_ON_ENDSTOP=home SPEED=20 ACCEL=100
    MANUAL_STEPPER STEPPER=j1 SET_POSITION={home_offset}
    MANUAL_STEPPER STEPPER=j1 MOVE={safe_position} SPEED=80 ACCEL=100

[gcode_macro HOME_J2]
gcode:
    {% set home_offset = 0.0 %}
    {% set safe_position = 50.0 %}
    WAKE_ARM
    MANUAL_STEPPER STEPPER=j2 SET_POSITION=0
    MANUAL_STEPPER STEPPER=j2 MOVE=-180 STOP_ON_ENDSTOP=home SPEED=20 ACCEL=100
    MANUAL_STEPPER STEPPER=j2 SET_POSITION={home_offset}
    MANUAL_STEPPER STEPPER=j2 MOVE={safe_position} SPEED=40 ACCEL=100

[gcode_macro HOME_J3]
gcode:
    {% set home_offset = 0.0 %}
    {% set safe_position = 70.0 %}
    WAKE_ARM
    MANUAL_STEPPER STEPPER=j3 SET_POSITION=0
    MANUAL_STEPPER STEPPER=j3 MOVE=-240 STOP_ON_ENDSTOP=home SPEED=20 ACCEL=100
    MANUAL_STEPPER STEPPER=j3 SET_POSITION={home_offset}
    MANUAL_STEPPER STEPPER=j3 MOVE={safe_position} SPEED=30 ACCEL=100

[gcode_macro HOME_J4]
gcode:
    {% set home_offset = 0.0 %}
    {% set safe_position = -260.0 %}
    WAKE_ARM
    MANUAL_STEPPER STEPPER=j4 SET_POSITION=0
    MANUAL_STEPPER STEPPER=j4 MOVE=270 STOP_ON_ENDSTOP=home SPEED=60 ACCEL=100
    MANUAL_STEPPER STEPPER=j4 SET_POSITION={home_offset}
    MANUAL_STEPPER STEPPER=j4 MOVE={safe_position} SPEED=80 ACCEL=100

[gcode_macro HOME_J5]
gcode:
    {% set home_offset = 0.0 %}
    {% set safe_position = 120.0 %}
    WAKE_ARM
    MANUAL_STEPPER STEPPER=j6 MOVE=-10 SPEED=80 ACCEL=100
    MANUAL_STEPPER STEPPER=j5 SET_POSITION=0
    MANUAL_STEPPER STEPPER=j5 MOVE=-360 STOP_ON_ENDSTOP=home SPEED=60 ACCEL=100
    MANUAL_STEPPER STEPPER=j5 SET_POSITION={home_offset}
    MANUAL_STEPPER STEPPER=j5 MOVE={safe_position} SPEED=80 ACCEL=100
    MANUAL_STEPPER STEPPER=j6 MOVE=-5 SPEED=80 ACCEL=100

[gcode_macro HOME_J6]
gcode:
    {% set home_offset = 0.0 %}
    {% set safe_position = -4.0 %}
    WAKE_ARM
    MANUAL_STEPPER STEPPER=j6 SET_POSITION=0
    MANUAL_STEPPER STEPPER=j6 MOVE=360 STOP_ON_ENDSTOP=home SPEED=60 ACCEL=100
    MANUAL_STEPPER STEPPER=j6 SET_POSITION={home_offset}
    MANUAL_STEPPER STEPPER=j6 MOVE={safe_position} SPEED=80 ACCEL=100

[gcode_macro HOME]
description: Sequentially home all joints and apply CAD zero reference
gcode:
    HOME_J2
    HOME_J3
    HOME_J1
    HOME_J4
    HOME_J6
    HOME_J5
    {action_respond_info("All joints homed. Proceeding to CAD home position...")}
    GO_CAD_HOME

[gcode_macro HOME_WRIST]
description: Home wrist assembly (J4, J5, J6)
gcode:
    HOME_J4
    HOME_J5
    HOME_J6

# ----------------------------------------------------------------------
# POSITIONAL PRESETS
# ----------------------------------------------------------------------
[gcode_macro GO_CAD_HOME]
description: Stel de as-posities in op de exacte PAROL6 CAD nulpositie
gcode:
    WAKE_ARM
    MANUAL_STEPPER STEPPER=j1 SET_POSITION=0
    MANUAL_STEPPER STEPPER=j2 SET_POSITION=-90
    MANUAL_STEPPER STEPPER=j3 SET_POSITION=180
    MANUAL_STEPPER STEPPER=j4 SET_POSITION=0
    MANUAL_STEPPER STEPPER=j5 SET_POSITION=0
    MANUAL_STEPPER STEPPER=j6 SET_POSITION=180
    {action_respond_info("As-waarden op CAD positie ingesteld: J1=0, J2=-90, J3=180, J4=0, J5=0, J6=180")}

[gcode_macro PARK]
description: Compacte transport positie
gcode:
    MOVE J1=0 J2=-138 J3=110 J4=80 J5=130 J6=180 E=0
    {action_respond_info("Arm in opgevouwen transportpositie (PARK)")}

[gcode_macro CANDLE]
description: Volledig gestrekte verticale positie
gcode:
    MOVE J1=0 J2=-90 J3=260 J4=0 J5=0 J6=180
    {action_respond_info("Arm in Candle positie (recht omhoog)")}

# ----------------------------------------------------------------------
# DIAGNOSTICS & TELEMETRY
# ----------------------------------------------------------------------
[gcode_macro GET_ARM_STATUS]
description: Weergave actuele gewrichtshoeken en gripper opening
gcode:
    {% set j1_p = printer["gcode_macro J_ONE_PLUS"].pos|default(0.0)|float %}
    {% set j2_p = printer["gcode_macro J_TWO_PLUS"].pos|default(0.0)|float %}
    {% set j3_p = printer["gcode_macro J_THREE_PLUS"].pos|default(0.0)|float %}
    {% set j4_p = printer["gcode_macro J_FOUR_PLUS"].pos|default(0.0)|float %}
    {% set j5_p = printer["gcode_macro J_FIVE_PLUS"].pos|default(0.0)|float %}
    {% set j6_p = printer["gcode_macro J_SIX_PLUS"].pos|default(0.0)|float %}
    {% set grip_mm = printer["gcode_macro GRIPPER_PLUS_1"].gap_mm|default(62.5)|float %}

    {action_respond_info("=== 🤖 ROBOT ARM LIVE STATUS ===")}
    {action_respond_info("J1 (Base)    : %.1f°" % j1_p)}
    {action_respond_info("J2 (Shoulder): %.1f°" % j2_p)}
    {action_respond_info("J3 (Elbow)   : %.1f°" % j3_p)}
    {action_respond_info("J4 (Forearm) : %.1f°" % j4_p)}
    {action_respond_info("J5 (Pitch)   : %.1f°" % j5_p)}
    {action_respond_info("J6 (Roll)    : %.1f°" % j6_p)}
    {action_respond_info("Gripper Gap  : %.2f mm" % grip_mm)}
    {action_respond_info("================================")}

# ----------------------------------------------------------------------
# MULTI-AXIS SYNCHRONIZED MOTION MACRO
# ----------------------------------------------------------------------
[gcode_macro MOVE]
description: Beweeg gewrichten met individuele/globale snelheden en acceleraties binnen veilige limieten
gcode:
    WAKE_ARM

    # ------------------------------------------------------------------
    # HARD LIMITS PER JOINT (deg/s and deg/s^2)
    # ------------------------------------------------------------------
    {% set max_v1 = 100.0 %}
    {% set max_v2 = 50.0 %}
    {% set max_v3 = 50.0 %}
    {% set max_v4 = 50.0 %}
    {% set max_v5 = 50.0 %}
    {% set max_v6 = 50.0 %}

    {% set max_a1 = 100.0 %}
    {% set max_a2 = 100.0 %}
    {% set max_a3 = 100.0 %}
    {% set max_a4 = 100.0 %}
    {% set max_a5 = 100.0 %}
    {% set max_a6 = 100.0 %}

    # Default fallback motion parameters
    {% set default_spd = params.SPEED|default(40)|float %}
    {% set default_acc = params.ACCEL|default(40)|float %}

    # Resolve per-joint speeds (clamped: min 0.1 deg/s, max joint limit)
    {% set v1 = [0.1, [params.S1|default(params.V1|default(default_spd))|float, max_v1]|min]|max %}
    {% set v2 = [0.1, [params.S2|default(params.V2|default(default_spd))|float, max_v2]|min]|max %}
    {% set v3 = [0.1, [params.S3|default(params.V3|default(default_spd))|float, max_v3]|min]|max %}
    {% set v4 = [0.1, [params.S4|default(params.V4|default(default_spd))|float, max_v4]|min]|max %}
    {% set v5 = [0.1, [params.S5|default(params.V5|default(default_spd))|float, max_v5]|min]|max %}
    {% set v6 = [0.1, [params.S6|default(params.V6|default(default_spd))|float, max_v6]|min]|max %}

    # Resolve per-joint accelerations (clamped: min 1.0 deg/s^2, max joint limit)
    {% set a1 = [1.0, [params.A1|default(default_acc)|float, max_a1]|min]|max %}
    {% set a2 = [1.0, [params.A2|default(default_acc)|float, max_a2]|min]|max %}
    {% set a3 = [1.0, [params.A3|default(default_acc)|float, max_a3]|min]|max %}
    {% set a4 = [1.0, [params.A4|default(default_acc)|float, max_a4]|min]|max %}
    {% set a5 = [1.0, [params.A5|default(default_acc)|float, max_a5]|min]|max %}
    {% set a6 = [1.0, [params.A6|default(default_acc)|float, max_a6]|min]|max %}

    # Determine which joint is executed last to enforce SYNC=1
    {% set has_j6 = params.J6 is defined %}
    {% set has_j5 = params.J5 is defined and not has_j6 %}
    {% set has_j4 = params.J4 is defined and not has_j5 and not has_j6 %}
    {% set has_j3 = params.J3 is defined and not has_j4 and not has_j5 and not has_j6 %}
    {% set has_j2 = params.J2 is defined and not has_j3 and not has_j4 and not has_j5 and not has_j6 %}
    {% set has_j1 = params.J1 is defined and not has_j2 and not has_j3 and not has_j4 and not has_j5 and not has_j6 %}

    {% if params.J1 is defined %}
        {% set sync = 1 if has_j1 else 0 %}
        MANUAL_STEPPER STEPPER=j1 MOVE={params.J1|float} SPEED={v1} ACCEL={a1} SYNC={sync}
    {% endif %}

    {% if params.J2 is defined %}
        {% set sync = 1 if has_j2 else 0 %}
        MANUAL_STEPPER STEPPER=j2 MOVE={params.J2|float} SPEED={v2} ACCEL={a2} SYNC={sync}
    {% endif %}

    {% if params.J3 is defined %}
        {% set sync = 1 if has_j3 else 0 %}
        MANUAL_STEPPER STEPPER=j3 MOVE={params.J3|float} SPEED={v3} ACCEL={a3} SYNC={sync}
    {% endif %}

    {% if params.J4 is defined %}
        {% set sync = 1 if has_j4 else 0 %}
        MANUAL_STEPPER STEPPER=j4 MOVE={params.J4|float} SPEED={v4} ACCEL={a4} SYNC={sync}
    {% endif %}

    {% if params.J5 is defined %}
        {% set sync = 1 if has_j5 else 0 %}
        MANUAL_STEPPER STEPPER=j5 MOVE={params.J5|float} SPEED={v5} ACCEL={a5} SYNC={sync}
    {% endif %}

    {% if params.J6 is defined %}
        {% set sync = 1 if has_j6 else 0 %}
        MANUAL_STEPPER STEPPER=j6 MOVE={params.J6|float} SPEED={v6} ACCEL={a6} SYNC={sync}
    {% endif %}

    # Gripper actuation post-movement (if specified)
    {% if params.E is defined %}
        E D={params.E}
    {% elif params.D is defined %}
        E D={params.D}
    {% elif params.GRIP is defined %}
        E D={params.GRIP}
    {% endif %}

    {action_respond_info("Move en optionele gripper actie voltooid")}