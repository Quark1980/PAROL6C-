# ======================================================================
# PAROL6 6-DOF ROBOTIC ARM - NATIVE 6-AXIS KLIPPER CONFIGURATION
# ======================================================================
# Architecture: Headless 6-Axis Klipper Core (gear2nd-droid/klipper)
# Kinematics: parol6_6axis (Native 6-Axis trapq / itersolve)
# MCU: Arduino Mega 2560 + RAMPS 1.4 @ 250,000 baud
# ======================================================================

[include mainsail.cfg]

# ----------------------------------------------------------------------
# ARDUINO MEGA / RAMPS 1.4 PIN ALIASES
# ----------------------------------------------------------------------
[board_pins arduino-mega]
aliases:
    ar0=PE0, ar1=PE1, ar2=PE4, ar3=PE5, ar4=PG5,
    ar5=PE3, ar6=PH3, ar7=PH4, ar8=PH5, ar9=PH6,
    ar10=PB4, ar11=PB5, ar12=PB6, ar13=PB7, ar14=PJ1,
    ar15=PJ0, ar16=PH1, ar17=PH0, ar18=PD3, ar19=PD2,
    ar20=PD1, ar21=PD0, ar22=PA0, ar23=PA1, ar24=PA2,
    ar25=PA3, ar26=PA4, ar27=PA5, ar28=PA6, ar29=PA7,
    ar30=PC7, ar31=PC6, ar32=PC5, ar33=PC4, ar34=PC3,
    ar35=PC2, ar36=PC1, ar37=PC0, ar38=PD7, ar39=PG2,
    ar40=PG1, ar41=PG0, ar42=PL7, ar43=PL6, ar44=PL5,
    ar45=PL4, ar46=PL3, ar47=PL2, ar48=PL1, ar49=PL0,
    ar50=PB3, ar51=PB2, ar52=PB1, ar53=PB0, ar54=PF0,
    ar55=PF1, ar56=PF2, ar57=PF3, ar58=PF4, ar59=PF5,
    ar60=PF6, ar61=PF7, ar62=PK0, ar63=PK1, ar64=PK2,
    ar65=PK3, ar66=PK4, ar67=PK5, ar68=PK6, ar69=PK7

# ----------------------------------------------------------------------
# MCU & PRIMARY PRINTER DEFINITION
# ----------------------------------------------------------------------
[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
baud: 250000

[printer]
kinematics: parol6_6axis
max_velocity: 300
max_accel: 1500
max_accel_to_decel: 1500
square_corner_velocity: 35.0

[force_move]
enable_force_move: true

[idle_timeout]
timeout: 86400
gcode:

# ----------------------------------------------------------------------
# PRIMARY 6-AXIS STEPPERS (NATIVE TRAPQ SYNCHRONIZED)
# ----------------------------------------------------------------------

# Joint 1: Base Yaw (GT2 Belt 160:16 = 10:1)
[stepper_x]
step_pin: PF0
dir_pin: !PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 360
gear_ratio: 10:1
endstop_pin: ^PE5  # RAMPS X-min pin
position_endstop: 0.0
position_min: -360.0
position_max: 360.0
homing_speed: 20.0
homing_positive_dir: false
homing_retract_dist: 10.0
second_homing_speed: 5.0

# Joint 2: Shoulder Pitch (50:1 Gearbox)
[stepper_y]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 360
gear_ratio: 50:1
endstop_pin: ^PE4  # RAMPS X-max pin
position_endstop: 0.0
position_min: -180.0
position_max: 180.0
homing_speed: 20.0
homing_positive_dir: false
homing_retract_dist: 10.0
second_homing_speed: 5.0

# Joint 3: Elbow Pitch (50:1 Gearbox + 26:26 XT Belt)
[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 360
gear_ratio: 50:1
endstop_pin: ^PJ1  # RAMPS Y-min pin
position_endstop: 0.0
position_min: -180.0
position_max: 270.0
homing_speed: 20.0
homing_positive_dir: false
homing_retract_dist: 10.0
second_homing_speed: 5.0

# Joint 4: Forearm Roll (Corrected Pulley Pitch Ratio 805:180)
[stepper_a]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 360
gear_ratio: 805:180
endstop_pin: ^PJ0  # RAMPS Y-max pin
position_endstop: 0.0
position_min: -360.0
position_max: 360.0
homing_speed: 40.0
homing_positive_dir: true
homing_retract_dist: 10.0
second_homing_speed: 5.0

# Joint 5: Wrist Pitch (GT2 Belt 60:16 = 480:109)
[stepper_b]
step_pin: PC1
dir_pin: PC3
enable_pin: !PC7
microsteps: 16
rotation_distance: 360
gear_ratio: 480:109
endstop_pin: ^PD3  # RAMPS Z-min pin
position_endstop: 0.0
position_min: -180.0
position_max: 180.0
homing_speed: 40.0
homing_positive_dir: false
homing_retract_dist: 10.0
second_homing_speed: 5.0

# Joint 6: Wrist Roll (Direct Drive 1:1 via AUX breakout board)
[stepper_c]
step_pin: PG1
dir_pin: PG0
enable_pin: !PK1
microsteps: 16
rotation_distance: 360
gear_ratio: 1:1
endstop_pin: ^PD2  # RAMPS Z-max pin
position_endstop: 0.0
position_min: -360.0
position_max: 360.0
homing_speed: 40.0
homing_positive_dir: true
homing_retract_dist: 10.0
second_homing_speed: 5.0

# ----------------------------------------------------------------------
# END EFFECTOR: SERVO GRIPPER (RAMPS Servo 0 / Pin ar11 / PB5 & Servo 3 / PG5 / ar4)
# ----------------------------------------------------------------------
[servo gripper]
pin: ar11
maximum_servo_angle: 180
minimum_pulse_width: 0.0005
maximum_pulse_width: 0.0025
initial_angle: 90

[servo gripper_aux]
pin: PG5
maximum_servo_angle: 180
minimum_pulse_width: 0.0005
maximum_pulse_width: 0.0025
initial_angle: 90

# ----------------------------------------------------------------------
# GRIPPER CONTROL MACROS
# ----------------------------------------------------------------------
[gcode_macro GRIPPER]
description: Actuate gripper via gap distance (D=0..62.5 mm) or servo angle (ANGLE=0..180 deg)
gcode:
    {% set max_mm = 62.5 %}
    {% set max_angle = 180.0 %}

    {% if params.ANGLE is defined or params.P is defined %}
        {% set target = params.ANGLE|default(params.P)|float %}
        {% set target = [0.0, [target, max_angle]|min]|max %}
    {% elif params.D is defined or params.MM is defined %}
        {% set mm = params.D|default(params.MM)|float %}
        {% set mm = [0.0, [mm, max_mm]|min]|max %}
        {% set target = max_angle - (mm / max_mm * max_angle) %}
    {% else %}
        {% set target = 0.0 %}
    {% endif %}

    SET_SERVO SERVO=gripper ANGLE={target}
    SET_SERVO SERVO=gripper_aux ANGLE={target}
    {% set current_mm = (max_angle - target) / max_angle * max_mm %}
    {action_respond_info("Gripper set to %.1f deg (%.2f mm gap)" % (target, current_mm))}

[gcode_macro OPEN_GRIPPERS]
description: Fully open gripper to 62.5mm
gcode:
    GRIPPER D=62.5

[gcode_macro CLOSE_GRIPPERS]
description: Fully close gripper to 0mm
gcode:
    GRIPPER D=0.0

# ----------------------------------------------------------------------
# SEQUENTIAL HOMING & CAD CALIBRATION
# ----------------------------------------------------------------------
[gcode_macro WAKE_ARM]
description: Energize all arm steppers
gcode:
    M17
    {action_respond_info("All 6 arm stepper drivers energized.")}

[gcode_macro HOME_J2]
description: Home Joint 2 (Shoulder Pitch) and lift to safe position (+50 deg)
gcode:
    G28 Y
    G1 Y50 F1200

[gcode_macro HOME_J3]
description: Home Joint 3 (Elbow Pitch) and lift to safe position (+70 deg)
gcode:
    G28 Z
    G1 Z70 F1200

[gcode_macro HOME_J1]
description: Home Joint 1 (Base Yaw) and swing to safe position (+174 deg)
gcode:
    G28 X
    G1 X174 F2400

[gcode_macro HOME_J4]
description: Home Joint 4 (Forearm Roll) and rotate to safe position (-260 deg)
gcode:
    G28 A
    G1 A-260 F2400

[gcode_macro HOME_J6]
description: Home Joint 6 (Wrist Roll) and rotate to safe position (-4 deg)
gcode:
    G28 C
    G1 C-4 F2400

[gcode_macro HOME_J5]
description: Home Joint 5 (Wrist Pitch) and move to safe position (+120 deg)
gcode:
    G1 C-14 F2400
    G28 B
    G1 B120 F2400
    G1 C-4 F2400

[gcode_macro SET_CAD_HOME]
description: Set coordinate registers to exact PAROL6 CAD zero position
gcode:
    SET_KINEMATIC_POSITION X=0 Y=-90 Z=180 A=0 B=0 C=180
    {action_respond_info("PAROL6 calibrated to CAD home: J1=0, J2=-90, J3=180, J4=0, J5=0, J6=180")}

# Backward-compatible alias
[gcode_macro GO_CAD_HOME]
description: Legacy alias for SET_CAD_HOME
gcode:
    SET_CAD_HOME

[gcode_macro HOME]
description: Full PAROL6 sequential collision-avoidance homing sequence
gcode:
    HOME_J2
    HOME_J3
    HOME_J1
    HOME_J4
    HOME_J6
    HOME_J5
    SET_CAD_HOME
